name: customer_app
description: OpenDelivery Customer App
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  opendelivery_core:
    path: ../../packages/core
  opendelivery_network:
    path: ../../packages/network
  opendelivery_design_system:
    path: ../../packages/design_system
  opendelivery_shared_widgets:
    path: ../../packages/shared_widgets
  opendelivery_auth:
    path: ../../packages/auth
  opendelivery_notifications:
    path: ../../packages/notifications

  flutter_bloc: ^8.1.6
  equatable: ^2.0.7
  go_router: ^14.6.2
  get_it: ^8.0.3
  injectable: ^2.5.0

  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  intl: any
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
